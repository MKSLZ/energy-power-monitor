name: energy-daily-update

# 北京时间每 3 小时的第 13 分跑一次（UTC+8 = UTC-8）：
# 北京 00:13,03:13,06:13,09:13,12:13,15:13,18:13,21:13 → UTC 16,19,22,1,4,7,10,13 点 13 分。
# 注意：GitHub 定时任务可能延迟数分钟~十几分钟，属正常现象。
on:
  workflow_dispatch:
  schedule:
    - cron: '13 16,19,22,1,4,7,10,13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# 同一 ref 同一时刻只保留一个运行：新触发（手动/定时）会取消尚未完成的旧运行，
# 从根上杜绝多个机器人同时提交同一份 site/history 造成的 non-fast-forward 竞争。
concurrency:
  group: energy-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (online)
        run: python3 src/main.py
        # 不 echo 任何密钥；缺 LLM_API_KEY 时自动走数据速览版。

      - name: Commit site & history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site data
          # 无变化则跳过提交；有变化才提交
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 推送被抢（偶发并发/延迟的另一轮先推）时，rebase 后重试最多 3 次。
            # site/history 是每次全新生成的快照，冲突以“本次最新产物”为准；
            # 注意 rebase 中 theirs 指正在重放的当前提交（即本次产物）。
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "push rejected; fetch+rebase then retry ($i)"
              git fetch origin main
              if ! git rebase -X theirs origin/main; then git rebase --abort; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then git push && ok=1; fi
            [ "$ok" = 1 ]
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
