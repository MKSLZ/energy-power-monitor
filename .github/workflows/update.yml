name: energy-daily-update

# 北京时间每 3 小时的第 13 分跑一次（UTC+8 = UTC-8）：
# 北京 00:13,03:13,06:13,09:13,12:13,15:13,18:13,21:13 → UTC 16,19,22,1,4,7,10,13 点 13 分。
# 注意：GitHub 定时任务可能延迟数分钟~十几分钟，属正常现象。
on:
  workflow_dispatch:
  schedule:
    - cron: '13 16,19,22,1,4,7,10,13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只串行跑一个，不取消正在进行的一轮
concurrency:
  group: energy-daily
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (online)
        run: python3 src/main.py
        # 不 echo 任何密钥；缺 LLM_API_KEY 时自动走数据速览版。

      - name: Commit site & history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site data/history.json
          # 无变化则跳过提交；有变化才提交
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
